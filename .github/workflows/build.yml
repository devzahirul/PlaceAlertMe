name: Build

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # C++ Library Build
  cpp-build:
    name: Build C++ Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build C++ library
        run: |
          cmake -S cpp/geo_engine -B cpp/geo_engine/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build cpp/geo_engine/build --config Release

      - name: Upload C++ artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpp-build
          path: cpp/geo_engine/build/

  # Android Library Build
  android-build:
    name: Build Android Library (AAR) & Example App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p android/gradle/wrapper
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Build Android library
        working-directory: ./android
        run: ./gradlew build --no-daemon

      - name: Generate library release AAR
        working-directory: ./android
        run: ./gradlew :geo-engine:assembleRelease --no-daemon

      - name: Generate example app release APK
        working-directory: ./android
        run: ./gradlew :example-app:assembleRelease --no-daemon

      - name: Upload Android Library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-library
          path: android/geo-engine/build/outputs/aar/

      - name: Upload Example App APK
        uses: actions/upload-artifact@v4
        with:
          name: example-app-release-apk
          path: android/example-app/build/outputs/apk/release/

      - name: Create release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            PlaceAlertMe Release
            - Android Library (AAR): `android/geo-engine/build/outputs/aar/`
            - Example App (APK): `android/example-app/build/outputs/apk/release/example-app-release.apk`
            - Features: Jetpack Compose UI, OpenStreetMap integration, geofence zone management
          draft: false
          prerelease: false

  # iOS Framework Build
  ios-build:
    name: Build iOS Framework
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build iOS framework
        working-directory: ./ios
        run: |
          mkdir -p build
          cd build
          cmake -GXcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release

      - name: Build Swift Package
        working-directory: ./ios
        run: |
          swift build -c release

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ios/build/
            ios/.build/

      - name: Create release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            iOS Framework Release
            - Swift Package: Available via SPM
            - Framework: ios/build/Release-iphoneos/
          draft: false
          prerelease: false

  # Build matrix for multiple platforms
  matrix-build:
    name: Build Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup build environment (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Setup build environment (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Setup build environment (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --no-progress

      - name: Build C++ (Ubuntu/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S cpp/geo_engine -B cpp/geo_engine/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build cpp/geo_engine/build --config Release

      - name: Build C++ (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S cpp/geo_engine -B cpp/geo_engine/build -G "Visual Studio 17 2022" -DBUILD_TESTS=OFF
          cmake --build cpp/geo_engine/build --config Release

      - name: Upload matrix build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matrix-build-${{ matrix.target }}
          path: cpp/geo_engine/build/
