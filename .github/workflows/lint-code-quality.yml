name: Code Quality

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Kotlin Linting
  kotlin-lint:
    name: Kotlin Lint (ktlint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run Kotlin lint
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew ktlint || true

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-lint-results
          path: android/geo-engine/build/reports/

  # Swift Linting
  swift-lint:
    name: Swift Lint (SwiftLint)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SwiftLint
        run: |
          brew install swiftlint

      - name: Run SwiftLint
        working-directory: ./ios
        run: |
          swiftlint || true

  # C++ Static Analysis
  cpp-analysis:
    name: C++ Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tools cmake

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem cpp/ || true

      - name: Run clang-tidy
        working-directory: ./cpp/geo_engine
        run: |
          mkdir -p build
          cd build
          cmake ..
          run-clang-tidy || true

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-analysis-results
          path: cpp/geo_engine/build/

  # Security scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run OWASP dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          path: '.'
          format: 'JSON'

      - name: Upload dependency check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-results
          path: dependency-check-results.json

  # Code review with CodeQL
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp', 'java' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
