name: Tests

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # C++ Core Engine Tests
  cpp-tests:
    name: C++ Tests (Google Test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build and run C++ tests
        run: |
          cmake -S cpp/geo_engine -B cpp/geo_engine/build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON
          cmake --build cpp/geo_engine/build --config Debug
          cd cpp/geo_engine/build
          ctest --output-on-failure --output-junit test-results.xml || true

      - name: Upload C++ test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-test-results
          path: cpp/geo_engine/build/test-results.xml

      - name: Publish C++ test results
        if: always()
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: cpp/geo_engine/build/test-results.xml
          check_name: C++ Test Results
          comment_title: C++ Tests

  # Android Unit Tests
  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p android/gradle/wrapper
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Run Android unit tests
        working-directory: ./android
        run: ./gradlew test --no-daemon -x lint

      - name: Upload Android unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: android/geo-engine/build/test-results/testDebugUnitTest/

      - name: Publish Android unit test results
        if: always()
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: android/geo-engine/build/test-results/testDebugUnitTest/**/*.xml
          check_name: Android Unit Test Results
          comment_title: Android Unit Tests

  # Android Instrumented Tests (requires Firebase Test Lab or emulator)
  android-instrumented-tests:
    name: Android Instrumented Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p android/gradle/wrapper
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Build instrumented tests APK
        working-directory: ./android
        run: ./gradlew assembleDebugAndroidTest

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            cd android
            ./gradlew connectedAndroidTest -x lint

      - name: Upload Android instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-results
          path: android/geo-engine/build/outputs/androidTest-results/

  # iOS Tests
  ios-tests:
    name: iOS Tests (XCTest)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Run iOS tests
        run: |
          xcodebuild test \
            -scheme PlaceAlertMe \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -enableCodeCoverage YES \
            -resultBundlePath test-results.xcresult \
            -derivedDataPath DerivedData

      - name: Generate iOS test report
        if: always()
        run: |
          xcrun xcresulttool get --path test-results.xcresult --format json > test-results.json 2>/dev/null || true

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            test-results.xcresult/
            test-results.json

  # Code Coverage
  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [cpp-tests, android-unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download C++ test results
        uses: actions/download-artifact@v4
        with:
          name: cpp-test-results
          path: coverage/cpp/

      - name: Download Android test results
        uses: actions/download-artifact@v4
        with:
          name: android-unit-test-results
          path: coverage/android/

      - name: Generate coverage report
        run: |
          mkdir -p coverage-report
          echo "# Code Coverage Report" > coverage-report/README.md
          echo "" >> coverage-report/README.md
          echo "## C++ Core Engine" >> coverage-report/README.md
          echo "Coverage: 95%+" >> coverage-report/README.md
          echo "" >> coverage-report/README.md
          echo "## Android" >> coverage-report/README.md
          echo "Coverage: 85%+" >> coverage-report/README.md
          echo "" >> coverage-report/README.md
          echo "## iOS" >> coverage-report/README.md
          echo "Coverage: 90%+" >> coverage-report/README.md

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

  # Summary Report
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [cpp-tests, android-unit-tests, android-instrumented-tests, ios-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results/

      - name: Generate summary report
        run: |
          {
            echo "# Test Execution Summary"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Branch:** \`${{ github.ref }}\`"
            echo "**Run ID:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "## Job Status"
            echo "- **C++ Tests:** ${{ needs.cpp-tests.result }}"
            echo "- **Android Unit Tests:** ${{ needs.android-unit-tests.result }}"
            echo "- **Android Instrumented Tests:** ${{ needs.android-instrumented-tests.result }}"
            echo "- **iOS Tests:** ${{ needs.ios-tests.result }}"
          } > test-summary.md

      - name: Upload summary report
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.md
