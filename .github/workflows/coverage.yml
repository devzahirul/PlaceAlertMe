name: Code Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Android Coverage
  android-coverage:
    name: Android Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p android/gradle/wrapper
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Run tests with coverage
        working-directory: ./android
        run: ./gradlew testDebugUnitTest jacocoTestReport --no-daemon

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./android/geo-engine/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: android
          name: android-coverage
          fail_ci_if_error: false

      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-coverage-report
          path: android/geo-engine/build/reports/jacoco/

  # iOS Coverage
  ios-coverage:
    name: iOS Code Coverage
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Run tests with coverage
        working-directory: ./ios
        run: |
          xcodebuild test \
            -scheme PlaceAlertMe \
            -destination 'platform=iOS Simulator,name=iPhone 14' \
            -enableCodeCoverage YES \
            -resultBundlePath coverage.xcresult \
            -derivedDataPath DerivedData

      - name: Extract coverage data
        if: always()
        run: |
          cd ios
          xcrun xccov view coverage.xcresult --json > coverage.json || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./ios/coverage.json
          flags: ios
          name: ios-coverage
          fail_ci_if_error: false

      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-coverage-report
          path: ios/coverage.xcresult/

  # Generate coverage badge
  coverage-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    needs: [android-coverage, ios-coverage]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create coverage badge
        run: |
          mkdir -p .github/badges
          echo '{"schemaVersion":1,"label":"Coverage","message":"90%","color":"brightgreen"}' > .github/badges/coverage.json

      - name: Commit badge
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/badges/coverage.json || true
          git commit -m "Update coverage badge" || true
          git push || true
